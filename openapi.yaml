openapi: 3.1.1
info:
  title: Monitor Home Assistant Stats
  version: "1.0"
paths:
  /raw/migrations:
    get:
      tags:
      - Migration
      summary: Get info about migrations
      responses:
        "200":
          description: received data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MigrationDto"
  /raw/recorders:
    get:
      tags:
      - Recorder
      summary: Get info about recorders
      responses:
        "200":
          description: received data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecorderDto"
  /raw/schemas:
    get:
      tags:
      - Schema Changes
      summary: Get info about schema changes
      responses:
        "200":
          description: received data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemaChangeDto"
  /raw/events:
    get:
      tags:
      - Event
      summary: Get info about events
      responses:
        "200":
          description: received data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventDto"
  /raw/statistics-runs:
    get:
      tags:
      - Statistics
      summary: List statistics recorder runs, most recent first
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        "200":
          description: Recorder run rows, most recent first, optionally capped by
            limit. Empty array if no runs recorded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticRunDto"
        "400":
          description: limit present but unparseable or negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /entities:
    get:
      tags:
      - Entities
      summary: List known entity ids
      responses:
        "200":
          description: List of entities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /statistics-meta:
    get:
      tags:
      - Statistics
      summary: List trackable statistic entities
      parameters:
      - name: search
        in: query
        schema:
          type: string
      responses:
        "200":
          description: List of statistic metadata entries, optionally filtered by
            search.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticMetaDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /statistics/{statisticId}:
    get:
      tags:
      - Statistics
      summary: Long-term statistics for one entity
      parameters:
      - name: statisticId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: integer
      - name: to
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      responses:
        "200":
          description: Long-term statistic rows, oldest first, optionally paginated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticDto"
        "400":
          description: from/to/limit/offset present but unparseable or negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown statisticId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /statistics/{statisticId}/short-term:
    get:
      tags:
      - Statistics
      summary: Short-term (5-minute) statistics for one entity
      parameters:
      - name: statisticId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: integer
      - name: to
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      responses:
        "200":
          description: Short-term statistic rows, oldest first, optionally paginated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticDto"
        "400":
          description: from/to/limit/offset present but unparseable or negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown statisticId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /statistics/{statisticId}/summary:
    get:
      tags:
      - Statistics
      summary: Aggregated min/max/avg/sum over a date range
      parameters:
      - name: statisticId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: integer
      - name: to
        in: query
        schema:
          type: integer
      responses:
        "200":
          description: Aggregate summary for the range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticSummaryDto"
        "400":
          description: from/to present but unparseable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown statisticId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /states/{entityId}:
    get:
      tags:
      - States
      summary: Latest recorded state for one entity
      parameters:
      - name: entityId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The most recent state row for this entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateDto"
        "404":
          description: Unknown entityId, or entity has no recorded state rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /states/{entityId}/history:
    get:
      tags:
      - States
      summary: State history for one entity
      parameters:
      - name: entityId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: integer
      - name: to
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      responses:
        "200":
          description: State rows, oldest first, optionally paginated. Empty array
            if entity known but has no rows in range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateDto"
        "400":
          description: from/to/limit/offset present but unparseable or negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown entityId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sensors:
    get:
      tags:
      - Sensors
      summary: List sensors with a human name, area, floor, category and unit
      parameters:
      - name: area
        in: query
        description: Exact area name.
        schema:
          type: string
      - name: category
        in: query
        description: 'Exact category: climate, air-quality, energy, utility, battery,
          light, diagnostic or other.'
        schema:
          type: string
      responses:
        "200":
          description: One sensor per statistic, ordered by entity id, optionally
            filtered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
components:
  schemas:
    MigrationDto:
      type: object
      title: MigrationDto
      required:
      - id
      - version
      properties:
        id:
          type: string
        version:
          type: integer
    RecorderDto:
      type: object
      title: RecorderDto
      required:
      - id
      - startTime
      - isClosedIncorrect
      - createdAt
      properties:
        id:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type:
          - string
          - "null"
          format: date-time
        isClosedIncorrect:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SchemaChangeDto:
      type: object
      title: SchemaChangeDto
      required:
      - id
      - changedAt
      properties:
        id:
          type: integer
        version:
          type:
          - integer
          - "null"
        changedAt:
          type: string
          format: date-time
    DataContentDto:
      type:
      - object
      - "null"
      title: DataContentDto
      required:
      - id
      properties:
        id:
          type: integer
        hash:
          type:
          - integer
          - "null"
        sharedData:
          type:
          - string
          - "null"
    EventTypeDto:
      type:
      - object
      - "null"
      title: EventTypeDto
      required:
      - id
      properties:
        id:
          type: integer
        type:
          type:
          - string
          - "null"
    EventDto:
      type: object
      title: EventDto
      required:
      - id
      properties:
        id:
          type: integer
        type:
          type:
          - string
          - "null"
        data:
          type:
          - string
          - "null"
        origin:
          type:
          - string
          - "null"
        originIdx:
          type:
          - integer
          - "null"
        timestamp:
          type:
          - string
          - "null"
          format: date-time
        timestampTs:
          type:
          - string
          - "null"
          format: date-time
        contextId:
          type:
          - string
          - "null"
        contextUserId:
          type:
          - string
          - "null"
        contextParentId:
          type:
          - string
          - "null"
        dataContent:
          $ref: "#/components/schemas/DataContentDto"
        eventType:
          $ref: "#/components/schemas/EventTypeDto"
    StatisticRunDto:
      type: object
      title: StatisticRunDto
      required:
      - runId
      - startedAtTs
      properties:
        runId:
          type: integer
        startedAtTs:
          type: integer
    ErrorDto:
      type: object
      title: ErrorDto
      required:
      - message
      properties:
        message:
          type: string
    EntityDto:
      type: object
      title: EntityDto
      required:
      - id
      properties:
        id:
          type: integer
        entityId:
          type:
          - string
          - "null"
    StatisticMetaDto:
      type: object
      title: StatisticMetaDto
      required:
      - id
      - meanType
      properties:
        id:
          type: integer
        statisticId:
          type:
          - string
          - "null"
        name:
          type:
          - string
          - "null"
        unitOfMeasurement:
          type:
          - string
          - "null"
        unitClass:
          type:
          - string
          - "null"
        source:
          type:
          - string
          - "null"
        hasMean:
          type:
          - boolean
          - "null"
        hasSum:
          type:
          - boolean
          - "null"
        meanType:
          type: integer
    StatisticDto:
      type: object
      title: StatisticDto
      required:
      - startTs
      properties:
        startTs:
          type: integer
        mean:
          type:
          - number
          - "null"
        meanWeight:
          type:
          - number
          - "null"
        min:
          type:
          - number
          - "null"
        max:
          type:
          - number
          - "null"
        sum:
          type:
          - number
          - "null"
        state:
          type:
          - number
          - "null"
    StatisticSummaryDto:
      type: object
      title: StatisticSummaryDto
      required:
      - statisticId
      properties:
        statisticId:
          type: string
        from:
          type:
          - string
          - "null"
        to:
          type:
          - string
          - "null"
        min:
          type:
          - number
          - "null"
        max:
          type:
          - number
          - "null"
        avg:
          type:
          - number
          - "null"
        sum:
          type:
          - number
          - "null"
    StateDto:
      type: object
      title: StateDto
      required:
      - entityId
      properties:
        entityId:
          type: string
        state:
          type:
          - string
          - "null"
        attributes:
          type:
          - string
          - "null"
        lastChangedTs:
          type:
          - integer
          - "null"
        lastUpdatedTs:
          type:
          - integer
          - "null"
        eventId:
          type:
          - integer
          - "null"
    SensorDto:
      type: object
      title: SensorDto
      required:
      - entityId
      - name
      - category
      properties:
        entityId:
          type: string
        name:
          type: string
        area:
          type:
          - string
          - "null"
        floor:
          type:
          - string
          - "null"
        category:
          type: string
        unit:
          type:
          - string
          - "null"