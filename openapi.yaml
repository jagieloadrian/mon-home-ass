openapi: 3.0.3
info:
  title: Monitor Home Assistant Stats
  version: "1.0"
  description: Readonly API over a Home Assistant recorder database (statistics/entities).
servers:
  - url: http://localhost:8080

paths:
  /statistics-meta:
    get:
      tags: [Statistics]
      summary: List trackable statistic entities
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: >-
            Case-insensitive substring match against statistic_id or name.
            Absent or empty returns every entry, unchanged.
      responses:
        "200":
          description: List of statistic metadata entries, optionally filtered by `search`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticMetaDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /statistics/{statisticId}:
    get:
      tags: [Statistics]
      summary: Long-term statistics for one entity
      parameters:
        - $ref: "#/components/parameters/StatisticId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Long-term statistic rows, oldest first, optionally paginated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticDto"
        "400":
          description: from/to/limit/offset present but unparseable or negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown statisticId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /statistics/{statisticId}/short-term:
    get:
      tags: [Statistics]
      summary: Short-term (5-minute) statistics for one entity
      parameters:
        - $ref: "#/components/parameters/StatisticId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Short-term statistic rows, oldest first, optionally paginated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticDto"
        "400":
          description: from/to/limit/offset present but unparseable or negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown statisticId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /statistics/{statisticId}/summary:
    get:
      tags: [Statistics]
      summary: Aggregated min/max/avg/sum over a date range
      parameters:
        - $ref: "#/components/parameters/StatisticId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Aggregate summary for the range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticSummaryDto"
        "400":
          description: from/to present but unparseable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown statisticId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /states/{entityId}:
    get:
      tags: [States]
      summary: Latest recorded state for one entity
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: The most recent state row for this entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateDto"
        "404":
          description: Unknown entityId, or entity has no recorded state rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /states/{entityId}/history:
    get:
      tags: [States]
      summary: State history for one entity
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: State rows, oldest first, optionally paginated. Empty array if entity known but has no rows in range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateDto"
        "400":
          description: from/to/limit/offset present but unparseable or negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown entityId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /statistics-runs:
    get:
      tags: [Statistics]
      summary: List statistics recorder runs, most recent first
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recorder run rows, most recent first, optionally capped by limit. Empty array if no runs recorded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticRunDto"
        "400":
          description: limit present but unparseable or negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /entities:
    get:
      tags: [Entities]
      summary: List known entity ids
      responses:
        "200":
          description: List of entities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

components:
  parameters:
    StatisticId:
      name: statisticId
      in: path
      required: true
      schema:
        type: string
      example: sensor.living_room_temperature
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string
      example: sensor.living_room_temperature
    From:
      name: from
      in: query
      required: false
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
            format: date-time
      description: Range start — epoch seconds or ISO-8601 date-time.
    To:
      name: to
      in: query
      required: false
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
            format: date-time
      description: Range end — epoch seconds or ISO-8601 date-time.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
      description: Max number of rows to return. Omit for no limit (all matching rows).
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      description: Number of rows to skip before applying limit. Omit for 0.

  schemas:
    ErrorDto:
      type: object
      required: [message]
      properties:
        message:
          type: string

    StatisticMetaDto:
      type: object
      required: [id, statisticId]
      properties:
        id:
          type: integer
        statisticId:
          type: string
        source:
          type: string
          nullable: true
        unitOfMeasurement:
          type: string
          nullable: true
        hasMean:
          type: boolean
          nullable: true
        hasSum:
          type: boolean
          nullable: true
        name:
          type: string
          nullable: true

    StatisticDto:
      type: object
      required: [startTs]
      properties:
        startTs:
          type: integer
          format: int64
          description: Period start, epoch seconds.
        mean:
          type: number
          format: double
          nullable: true
        min:
          type: number
          format: double
          nullable: true
        max:
          type: number
          format: double
          nullable: true
        sum:
          type: number
          format: double
          nullable: true
        state:
          type: number
          format: double
          nullable: true

    StatisticSummaryDto:
      type: object
      properties:
        statisticId:
          type: string
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        min:
          type: number
          format: double
          nullable: true
        max:
          type: number
          format: double
          nullable: true
        avg:
          type: number
          format: double
          nullable: true
        sum:
          type: number
          format: double
          nullable: true

    EntityDto:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        entityId:
          type: string
          nullable: true

    StateDto:
      type: object
      required: [entityId]
      properties:
        entityId:
          type: string
        state:
          type: string
          nullable: true
        attributes:
          type: string
          nullable: true
          description: Opaque shared-attributes text, not parsed.
        lastChangedTs:
          type: integer
          format: int64
          nullable: true
        lastUpdatedTs:
          type: integer
          format: int64
          nullable: true

    StatisticRunDto:
      type: object
      required: [runId, startedAtTs]
      properties:
        runId:
          type: integer
        startedAtTs:
          type: integer
          format: int64
