# Contract delta for this feature — merge into repo-root openapi.yaml during implementation.
# Existing /statistics/{statisticId} path stays; only From/To param schemas change
# (int64-only -> epoch-seconds-or-ISO-8601 string), per spec Clarifications.

components:
  parameters:
    From:
      name: from
      in: query
      required: false
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
            format: date-time
      description: Range start — epoch seconds or ISO-8601 date-time.
    To:
      name: to
      in: query
      required: false
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
            format: date-time
      description: Range end — epoch seconds or ISO-8601 date-time.

  schemas:
    StatisticDto:
      type: object
      properties:
        startTs:
          type: integer
          format: int64
          description: Period start, epoch seconds.
        mean:
          type: number
          nullable: true
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        sum:
          type: number
          nullable: true
        state:
          type: number
          nullable: true
      required: [startTs]

paths:
  /statistics/{statisticId}:
    get:
      tags: [Statistics]
      summary: Long-term statistics for one entity
      parameters:
        - $ref: "#/components/parameters/StatisticId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Long-term statistic rows, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticDto"
        "400":
          description: from/to present but unparseable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown statisticId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
