# Contract delta for this feature — merge into repo-root openapi.yaml during implementation.
# /statistics-meta already exists in openapi.yaml with 200/503 responses;
# this adds the optional `search` query parameter. No schema/response change.

paths:
  /statistics-meta:
    get:
      tags: [Statistics]
      summary: List trackable statistic entities
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: >-
            Case-insensitive substring match against statistic_id or name.
            Absent or empty returns every entry, unchanged.
      responses:
        "200":
          description: List of statistic metadata entries, optionally filtered by `search`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticMetaDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
