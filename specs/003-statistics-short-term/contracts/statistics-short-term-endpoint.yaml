# Contract delta for this feature — merge into repo-root openapi.yaml during implementation.
# Existing /statistics/{statisticId}/short-term path already has 200/404 — only
# the 400 response needs adding, matching Phase 2's malformed from/to behavior.
# From/To/StatisticDto/ErrorDto schemas are already correct from Phase 2 — no change.

paths:
  /statistics/{statisticId}/short-term:
    get:
      tags: [Statistics]
      summary: Short-term (5-minute) statistics for one entity
      parameters:
        - $ref: "#/components/parameters/StatisticId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Short-term statistic rows, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticDto"
        "400":
          description: from/to present but unparseable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown statisticId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
