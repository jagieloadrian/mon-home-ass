# Contract delta for this feature — merge into repo-root openapi.yaml during implementation.
# /statistics/{statisticId}/summary and StatisticSummaryDto already exist in
# openapi.yaml as stubs; this adds the missing 400 (bad range) and 503
# (recorder db down) responses, gives 404 a body schema, and marks
# from/to nullable (they're optional query params — echoed back null when
# omitted), matching the established pattern from
# /statistics/{statisticId}.

paths:
  /statistics/{statisticId}/summary:
    get:
      tags: [Statistics]
      summary: Aggregated min/max/avg/sum over a date range
      parameters:
        - $ref: "#/components/parameters/StatisticId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Aggregate summary for the range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticSummaryDto"
        "400":
          description: from/to present but unparseable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Unknown statisticId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Recorder database unreachable or query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

components:
  schemas:
    StatisticSummaryDto:
      type: object
      required: [statisticId]
      properties:
        statisticId:
          type: string
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        min:
          type: number
          format: double
          nullable: true
        max:
          type: number
          format: double
          nullable: true
        avg:
          type: number
          format: double
          nullable: true
        sum:
          type: number
          format: double
          nullable: true
