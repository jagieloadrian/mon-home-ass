ktor:
    application:
        modules:
            - com.anjo.monhomeass.ApplicationKt.module
    deployment:
        port: 8080
    cors:
        hosts: "$CORS_HOSTS:localhost:8080"
    database:
        user: "$DB_USER:db_user"
        password: "$DB_PASSWORD:db_password"
        url: "$DB_URL:db_url"
        database_name: "$DB_NAME:db_name"
        driver: "$DB_DRIVER:org.postgresql.Driver"
        database_type: "$DB_TYPE:postgres"
        file_path: "$?DB_FILE_PATH"
    redis:
        host: "$REDIS_HOST:localhost"
        port: "$REDIS_PORT:6379"
        ttlMillis: 300000
    homeassistant:
        url: "$?HA_URL"
        token: "$?HA_TOKEN"
    publisher:
        type: "$PUBLISHER:none"
        source_id: "$SOURCE_ID:home-assistant"
        source_token: "$?SOURCE_TOKEN"
        interval_seconds: "$PUBLISH_INTERVAL_SECONDS:60"
        lookback_minutes: "$PUBLISH_LOOKBACK_MINUTES:60"
    nats:
        url: "$NATS_URL:nats://localhost:4222"
        user: "$?NATS_USER"
        password: "$?NATS_PASSWORD"
        inbox_prefix: "$NATS_INBOX_PREFIX:_INBOX"
        subject_prefix: "$NATS_SUBJECT_PREFIX:stats.ingest"
    kafka:
        bootstrap_servers: "$KAFKA_BOOTSTRAP_SERVERS:localhost:9092"
        topic: "$KAFKA_TOPIC:stats.ingest"
