apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - mon-home-ass.yaml
# Nazwy dostają hash treści, więc zmiana config.env / secrets.sops.env robi rollout Deploymentu.
configMapGenerator:
  - name: mon-home-ass-config
    envs: [config.env]
    options:
      labels:
        app.kubernetes.io/name: mon-home-ass
        app.kubernetes.io/part-of: homelab
secretGenerator:
  - name: mon-home-ass-secrets
    envs: [secrets.sops.env] # zaszyfrowany SOPS (age), Flux odszyfrowuje przy budowaniu
    options:
      labels:
        app.kubernetes.io/name: mon-home-ass
        app.kubernetes.io/part-of: homelab
