apiVersion: v1
kind: Secret
metadata:
  name: mon-home-ass-config
type: Opaque
stringData:
  application.yaml: |
    ktor:
      application:
        modules:
          - com.anjo.monhomeass.ApplicationKt.module
      deployment:
        port: {{ .Values.service.port }}
      database:
        user: "{{ .Values.db.user }}"
        password: "{{ .Values.db.password }}"
        url: "{{ .Values.db.url }}"
        database_name: "{{ .Values.db.name }}"
        driver: "{{ .Values.db.driver }}"
        database_type: "{{ .Values.db.type }}"
