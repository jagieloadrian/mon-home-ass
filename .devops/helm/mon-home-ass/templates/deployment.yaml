apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-home-ass
  labels:
    app: mon-home-ass
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mon-home-ass
  template:
    metadata:
      labels:
        app: mon-home-ass
    spec:
      containers:
        - name: mon-home-ass
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config=/config/application.yaml"]
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: mon-home-ass-config
