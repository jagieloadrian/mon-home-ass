apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mon-home-ass
spec:
  interval: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./charts/app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    secrets: true
    image: ghcr.io/jagieloadrian/mon-home-ass:main-20261103221746-f5d58a6
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 384Mi
    route:
      hostname: mon-home-ass.home.arpa
    env:
      DB_TYPE: postgres
      DB_DRIVER: org.postgresql.Driver
      DB_URL: postgres.apps.svc.cluster.local:5432
      DB_NAME: home_assistant
      DB_USER: mon_home_ass
      CORS_HOSTS: ""
