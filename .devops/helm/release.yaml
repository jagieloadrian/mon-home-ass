# Wdrożenie: wspólny chart homelab-infra/charts/app (opis values: charts/app/values.yaml).
# Flux czyta .devops/helm/ z main; tag obrazu podbija CI (build.yml, krok Deploy).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mon-home-ass
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: mon-home-ass-values # secrets.sops.yaml (kustomization.yaml)
  values:
    image: ghcr.io/jagieloadrian/mon-home-ass:main-00000000000000-0000000
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 384Mi
    route:
      hostname: mon-home-ass.home.arpa
    # Jawna konfiguracja -> ConfigMap mon-home-ass-config. Sekrety: secrets.sops.yaml.
    # Opis zmiennych: .devops/README.md.
    env:
      DB_TYPE: postgres
      DB_DRIVER: org.postgresql.Driver
      DB_URL: postgres.apps.svc.cluster.local:5432
      DB_NAME: home_assistant
      DB_USER: mon_home_ass
      NATS_URL: nats://nats.apps.svc.cluster.local:4222
      NATS_STREAM: HOME_ASSISTANT
      NATS_SUBJECT: home-assistant.statistics
      NATS_INTERVAL_SECONDS: "60"
